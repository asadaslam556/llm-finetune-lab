# Weekly dependency update PRs. Minor and patch bumps are grouped into one PR
# per ecosystem so they are easy to review; major versions come separately.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      # react and react-dom must always move together, majors included, or
      # the build breaks on a version mismatch.
      react:
        patterns: [react, react-dom]
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
