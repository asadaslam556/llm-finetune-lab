name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first run. No point burning
# minutes on a commit nobody is looking at any more.
# CI only reads the code. Nothing here should be able to push, comment or
# publish, even if a dependency or action turns out to be malicious.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # No training extras here on purpose. The runner has no GPU, and the
      # whole dry-run path exists so CI can exercise all seven stages without
      # torch. If this job ever needs torch, something has leaked out of the
      # lazy imports.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format
        run: ruff format --check src tests

      - name: Test
        run: pytest --cov=finetune_lab --cov-report=term-missing

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --prefix web

      - name: Build
        run: npm run build --prefix web
