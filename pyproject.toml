[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-finetune-lab"
version = "2.0.1"
description = "Seven-stage QLoRA fine-tuning pipeline with a live ops console"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Asad Aslam" }]
maintainers = [{ name = "Asad Aslam" }]
keywords = ["qlora", "lora", "fine-tuning", "llm", "peft", "transformers", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The API server and the whole pipeline in dry mode. Light on purpose, no
# torch in here, so `pip install -e .` stays fast on any machine.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Real training. Multi-GB install, only needed on the machine that trains.
train = [
    "torch>=2.4",
    "transformers>=4.46",
    "peft>=0.13",
    "datasets>=3.0",
    "accelerate>=1.0",
    "huggingface_hub>=0.26",
]
# The QLoRA path specifically. Split out because bitsandbytes needs CUDA and
# will not install everywhere, and a hard dependency would make the whole
# project uninstallable on a Mac.
quant = ["bitsandbytes>=0.43"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7"]

[project.urls]
Homepage = "https://github.com/asadaslam556/llm-finetune-lab"
Repository = "https://github.com/asadaslam556/llm-finetune-lab"
Issues = "https://github.com/asadaslam556/llm-finetune-lab/issues"

[project.scripts]
finetune-lab = "finetune_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finetune_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length is ruff-format's job, not the linter's
    "B008",   # FastAPI's Depends() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers on purpose to keep state clean between runs.
"tests/*" = ["SLF001"]

[tool.ruff.lint.isort]
known-first-party = ["finetune_lab"]
